name: Feature request
description: Propose a bounded improvement to Parmesan's tools, workflow, or documentation.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need or workflow friction, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful behavior or documentation change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or other approaches, if any.
